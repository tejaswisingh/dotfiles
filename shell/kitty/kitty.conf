# Fonts
font_family family="FiraCode Nerd Font"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
modify_font cell_height 102%
disable_ligatures never

# Appearance
include current-theme.conf
background_opacity 0.95
dynamic_background_opacity yes
window_padding_width 10 5
window_margin_width 0
hide_window_decorations no
remember_window_size no
initial_window_width 120c
initial_window_height 34c
sync_to_monitor yes
resize_draw_strategy scale
resize_in_steps no

# Cursor
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
mouse_hide_wait 1.0

# Terminal
scrollback_lines 25000000
copy_on_select clipboard
clipboard_control write-clipboard write-primary
detect_urls yes
open_url_with default
shell_integration enabled
strip_trailing_spaces smart
wheel_scroll_multiplier 5.0

# Tabs
tab_bar_style powerline
tab_powerline_style round
tab_bar_edge top
tab_bar_background none
tab_bar_margin_width 8
tab_bar_margin_height 5 0
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template "  {index} "

# Performance
repaint_delay 8
input_delay 2

# Behavior
enable_audio_bell no
visual_bell_duration 0
confirm_os_window_close 0

# Splits
enabled_layouts splits,tall,stack
map ctrl+right launch --location=vsplit
map ctrl+up    launch --location=hsplit
map ctrl+shift+l next_layout

# Focus neighboring split
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Resize split
map ctrl+alt+left  resize_window narrower 5
map ctrl+alt+right resize_window wider 5
map ctrl+alt+up    resize_window taller 5
map ctrl+alt+down  resize_window shorter 5

# Tabs
map ctrl+t new_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5

# Close active split and tab if its the last split/window in tab
map ctrl+x close_window

# Reload config
map ctrl+r load_config_file

# Fuzzy select url(s) on terminal
map ctrl+shift+o open_url

# startup_session ~/.config/kitty/sessions/default.conf
